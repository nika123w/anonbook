<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>View Post</title>
    <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 60%;
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
      margin-top: 20px;
    }

    h1 {
      text-align: center;
      font-size: 2em;
      color: #333;
    }

    textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 1em;
      margin-bottom: 10px;
    }

    button {
      display: block;
      width: 100%;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1.1em;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    .post {
      background-color: #fff;
      border: 1px solid #ddd;
      margin-bottom: 15px;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.1);
    }

    .post img {
      max-width: 100%;
      margin-top: 10px;
      border-radius: 4px;
    }

    .comments {
      margin-top: 20px;
    }

    .comment {
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 4px;
    }

    .comment small {
      display: block;
      font-size: 0.8em;
      color: #888;
    }

    .comment p {
      font-size: 1em;
      color: #333;
    }
  </style>
</head>
<body>

<div class="container">
    <div id="post" class="post"></div>

    <h2>Add a New Comment</h2>
    <form id="commentForm">
        <textarea name="content" required placeholder="Write your comment..."></textarea><br>
        <button type="submit">Comment</button>
    </form>

    <h2>Comments</h2>
    <div id="comments" class="comments"></div>
</div>

<script>
    const postId = new URLSearchParams(location.search).get("postId");

    fetch(`/post?postId=${postId}`).then(r => r.json()).then(post => {
      const postDiv = document.getElementById("post");
      postDiv.innerHTML = `
        <p>${post.content}</p>
        ${post.photoPath ? `<img src="${post.photoPath}" alt="Post Image">` : ""}
      );
    });

    function loadComments() {
      fetch(`/comment?postId=${postId}`).then(r => r.json()).then(comments => {
        const div = document.getElementById("comments");
        div.innerHTML = "";
        comments.forEach(c => {
          const commentDiv = document.createElement("div");
          commentDiv.classList.add("comment");
          commentDiv.innerHTML = `
            <p>${c.content}</p>
            <small>${c.createdAt}</small>
          `;
          div.appendChild(commentDiv);
        });
      });
    }

    loadComments();

    document.getElementById("commentForm").onsubmit = e => {
      e.preventDefault();
      const content = e.target.content.value;
      fetch("/comment", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ postId: parseInt(postId), content })
      }).then(() => {
        e.target.reset();
        loadComments();
      });
    };
  </script>

</body>
</html>
